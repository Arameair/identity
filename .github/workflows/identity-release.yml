# Builds a real, versioned Identity B release when the owner pushes a tag
#   git tag identity-v0.3.0 && git push origin identity-v0.3.0
# Produces identity.exe (Windows) and identity (Linux) plus SHA256SUMS on
# a GitHub Release, so people download a known version instead of building a
# branch. NOT YET RUN: the first tag push is its first real test.
name: identity-release
on:
  push:
    tags: ["identity-v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
      - name: Refuse a release without the publisher GitHub App built in
        run: |
          if grep -q 'var GitHubAppClientID = ""' internal/publisher/publisher.go; then
            echo "::error::internal/publisher/publisher.go has no GitHub App Client ID; a release would show 'no GitHub App in this build'."
            exit 1
          fi
      - name: Build
        env:
          LDFLAGS: -X main.buildBranch=${{ github.ref_name }}
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/identity.exe .
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/identity .
          GOOS=windows GOARCH=amd64 go build -trimpath -o dist/identity-probe.exe ./cmd/identity-probe
          cd dist && sha256sum identity.exe identity identity-probe.exe > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/identity.exe dist/identity dist/identity-probe.exe dist/SHA256SUMS \
            --title "Identity ${{ github.ref_name }}" \
            --notes "Built by GitHub Actions from commit ${{ github.sha }}. Check downloads against SHA256SUMS. Built from the tagged commit."
