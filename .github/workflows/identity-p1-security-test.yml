# Experiment-only checks. No release or promotion.
name: identity-p1-security-test
on:
  push:
    branches:
      - experiment/identity-p1-security-hardening-20261026
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format check
        shell: bash
        run: |
          files="$(gofmt -l internal/app/apiv1.go internal/app/session.go internal/app/p1_security_test.go internal/pairing/pairing.go internal/pairing/p1_security_test.go)"
          if [ -n "$files" ]; then printf 'Unformatted Go files:\\n%s\\n' "$files"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Build Identity
        run: go build ./...
