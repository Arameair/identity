<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Identity</title>
<style>
:root{
  --bg:#f6f4ef; --paper:#fffdf9; --ink:#1d1c1a; --muted:#6b675f; --faint:#9a958b; --line:#e3ded3; --line2:#d3ccbe;
  --accent:#1f6f6b; --accent-ink:#fff; --accent-soft:#e3f0ee;
  --ok:#1e7a45; --ok-soft:#e2f2e7; --warn:#9a6200; --warn-soft:#fbf0d9; --bad:#b3261e; --bad-soft:#fbe5e2; --sim:#7a4dbf; --sim-soft:#efe8fa;
  --radius:12px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#151513; --paper:#1d1d1a; --ink:#ebe8e1; --muted:#a8a398; --faint:#7c776d; --line:#2f2e2a; --line2:#3c3a35;
  --accent:#5cb8b1; --accent-ink:#0d1a19; --accent-soft:#1d302e;
  --ok:#6fcf97; --ok-soft:#1b2c21; --warn:#e6b450; --warn-soft:#2e2615; --bad:#ff8a80; --bad-soft:#331c1a; --sim:#b89af0; --sim-soft:#271f36;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--line2);background:var(--paper);color:var(--ink);border-radius:8px;padding:7px 13px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.danger{color:var(--bad)}
button.link{border:none;background:none;color:var(--accent);padding:0;text-decoration:underline}
button.small{padding:4px 10px;font-size:13px}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:7px 10px}
.mono,code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
header{display:flex;align-items:center;gap:8px 10px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--paper);flex-wrap:wrap}
.logo{font-weight:750;font-size:18px;letter-spacing:-.01em}
.logo small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.chip{max-width:330px;overflow:hidden;text-overflow:ellipsis;display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.spacer{flex:1}
.testbar{background:var(--sim-soft);color:var(--sim);padding:6px 20px;font-size:13px;border-bottom:1px solid var(--line)}
main{max-width:1100px;margin:0 auto;padding:26px 20px 70px}
h1{font-size:30px;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:15px;margin:16px 0 8px}
p{margin:6px 0}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.stack>*+*{margin-top:16px}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;border-radius:5px;padding:2px 7px}
.b-sim{background:var(--sim-soft);color:var(--sim)} .b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-bad{background:var(--bad-soft);color:var(--bad)} .b-n{background:var(--line);color:var(--muted)}
.status{border-radius:10px;padding:14px 16px;border:1px solid var(--line)}
.status .big{font-size:17px;font-weight:700}
.status.ok{background:var(--ok-soft);border-color:transparent} .status.ok .big{color:var(--ok)}
.status.warn{background:var(--warn-soft);border-color:transparent} .status.warn .big{color:var(--warn)}
.status.bad{background:var(--bad-soft);border-color:transparent} .status.bad .big{color:var(--bad)}
.status.n .big{color:var(--muted)}
.kv{display:grid;grid-template-columns:170px 1fr;gap:5px 14px;font-size:14px}
.kv>div:nth-child(odd){color:var(--muted)}
.kv .mono{word-break:break-all}
.idcard{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--bg)}
.idcard .role{font-size:12px;letter-spacing:.06em;font-weight:700;color:var(--muted);text-transform:uppercase}
.idcard .val{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.welcome{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start}
@media (max-width:820px){.welcome{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.wizard{grid-template-columns:1fr!important}}
ol.journey{padding-left:20px;margin:12px 0;color:var(--muted)}
ol.journey li{margin:4px 0} ol.journey b{color:var(--ink)}
.wizard{display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:start}
.steps{list-style:none;margin:0;padding:0;position:sticky;top:16px}
.steps li{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:var(--muted);cursor:pointer}
.steps li .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line2);font-size:12px;font-weight:700;flex:none}
.steps li.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.on{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.steps li.on .n{border-color:var(--accent);color:var(--accent)}
.steps li.locked{cursor:not-allowed;opacity:.55}
.navrow{display:flex;justify-content:space-between;margin-top:20px;gap:8px}
.question{border:2px solid var(--accent);border-radius:12px;padding:16px;background:var(--accent-soft)}
.question .q{font-weight:700;font-size:16px}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.avatar{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.avatar.ai_companion{background:linear-gradient(135deg,#3a6df0,#7b4bd6)} .avatar.business{background:linear-gradient(135deg,#1f9e78,#3b7d3a)}
.avatar.person{background:linear-gradient(135deg,#d0673a,#a83d5a)} .avatar.project{background:linear-gradient(135deg,#7d6b2e,#b08a2a)} .avatar.other{background:#59606e}
.avatar.administrator{background:#1d1c1a} .avatar.system_service{background:repeating-linear-gradient(45deg,#666,#666 5px,#555 5px,#555 10px)}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--paper)}
details summary{cursor:pointer;font-weight:600}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:8px;padding:9px 16px;display:none;z-index:50;max-width:90vw;font-size:14px}
.toast.bad{background:var(--bad);color:#fff}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--paper);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;z-index:40;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .body{padding:12px 16px;overflow:auto;flex:1}
.ev{font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.ev .k{color:var(--accent);font-weight:600;margin:0 6px}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modalbg.on{display:flex}
.modal{background:var(--paper);border-radius:12px;padding:20px;width:min(640px,100%);max-height:90vh;overflow:auto}
.menu{position:absolute;right:20px;top:54px;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.12);padding:6px;z-index:45;min-width:300px;display:none}
.menu.on{display:block}
.menu button{display:block;width:100%;text-align:left;border:none;background:none;padding:8px 10px;border-radius:6px}
.menu button:hover{background:var(--bg)}
</style>
</head>
<body>
<header>
  <div class="logo">Identity<small>first-run prototype</small></div>
  <span class="chip" id="profileChip">…</span>
  <span class="chip mono" id="buildChip" style="display:inline-block">…</span>
  <div class="spacer"></div>
  <button class="small primary" id="btnNewUser" title="Open a brand-new empty profile. Nothing in the current profile changes.">Test as New User</button>
  <button class="small" id="btnProfiles">Profiles ▾</button>
  <button class="small" id="btnLogs">Logs</button>
  <button class="small" id="btnDiag">Copy Diagnostics</button>
</header>
<div class="menu" id="profileMenu"></div>
<div class="testbar" id="testbar">TEST PROTOTYPE · separate test data · the controller launcher, handshake and GitHub test states are SIMULATED · no process launching, no GitHub calls, no credentials, no AI</div>
<main id="main"><p class="muted">Loading…</p></main>
<div class="drawer" id="drawer"><div class="head"><b>Activity log</b><span class="faint" style="font-size:13px">this profile · newest last</span><div class="spacer"></div><button class="small" id="closeDrawer">Close</button></div><div class="body" id="drawerBody"></div></div>
<div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const when = t => t ? new Date(t).toLocaleString() : "—";
const rid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
let S = null, step = null, scanHits = null, checking = false, autoChecked = "", lastSig = "";

function toast(m, bad){ const t=$("#toast"); t.textContent=m; t.className="toast"+(bad?" bad":""); t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none", bad?6500:2600); }
async function api(path, body){
  const o = body === undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)};
  const r = await fetch(path, o); const ct = r.headers.get("content-type")||"";
  const d = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error((d && d.error) || ("HTTP "+r.status));
  return d;
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch { modal(`<h2>Copy this</h2><p class="muted">The browser blocked the clipboard — select all and copy.</p><textarea class="mono" style="width:100%;height:50vh">${esc(text)}</textarea><p><button onclick="closeModal()">Close</button></p>`); }
}
function modal(h){ $("#modal").innerHTML=h; $("#modalbg").classList.add("on"); }
function closeModal(){ $("#modalbg").classList.remove("on"); }
$("#modalbg").onclick = e => { if (e.target.id === "modalbg") closeModal(); };

async function load(poll){
  try { S = await api("/api/status"); } catch(e){ $("#main").innerHTML = `<div class="status bad"><div class="big">Identity isn't answering</div>${esc(e.message)}</div>`; return; }
  $("#profileChip").innerHTML = `Test profile <b>${esc(S.profile)}</b>`;
  $("#buildChip").textContent = `${S.config.commit.slice(0,12)} · ${S.config.branch}`; $("#buildChip").title = `${S.config.branch} @ ${S.config.commit}`;
  const inst = S.installation;
  if (inst && step === null) step = inst.setup_completed_at ? 0 : Math.max(2, inst.setup_step || 2);
  if (!inst) step = null;
  const sig = JSON.stringify([S.profile, S.installation, S.managed, S.controller, S.github, S.github_cli, S.problems, step, scanHits]);
  if (poll && sig === lastSig) return;
  lastSig = sig;
  render();
  // One check (which may use saved approval) when the controller is first shown for this profile.
  if (inst && (step === 0 || step >= 4) && autoChecked !== S.profile){ autoChecked = S.profile; check("page opened", true); }
}

function render(){
  const m = $("#main");
  if (!S.installation) return renderWelcome(m);
  if (step === 0) return renderOverview(m);
  renderWizard(m);
}

// ---------- welcome ----------
function renderWelcome(m){
  const restorable = S.profiles.filter(p => p.installation_id && !p.active);
  m.innerHTML = `
  <div class="welcome">
    <div>
      <span class="badge b-n">FIRST RUN</span>
      <h1 style="margin-top:10px">Welcome. Let's set up your installation.</h1>
      <p class="muted">Identity is the first app you open. It keeps the IDs that make your setup <i>yours</i>, and gets your Thought Controller workspace running.</p>
      <ol class="journey">
        <li><b>Create your administrator</b> and installation (or restore one)</li>
        <li><b>Add identities</b> — starting with TASS and an example business</li>
        <li><b>Check Thought Controller</b> and decide whether it may start automatically</li>
        <li><b>See GitHub status</b> — nothing is connected or required yet</li>
        <li><b>Open Thought Controller</b>, your thought workspace</li>
      </ol>
      <div class="card" style="margin-top:18px"><div class="kv">
        <div>Test profile</div><div><b>${esc(S.profile)}</b> — no installation yet</div>
        <div>Saved identities</div><div>0</div>
        <div>Data folder</div><div class="mono">${esc(S.profile_dir)}</div>
        <div>Branch</div><div class="mono">${esc(S.config.branch)} (${esc(S.config.branch_source)}${S.config.detached?", detached checkout":""})</div>
        <div>Commit</div><div class="mono">${esc(S.config.commit)}</div>
      </div></div>
    </div>
    <div class="stack">
      <div class="card"><h2>Create my installation</h2>
        <p class="muted">Makes three separate, permanent IDs on this computer: your <b>administrator</b>, this <b>installation</b>, and the <b>Thought Controller service</b>. No account or GitHub sign-in is needed.</p>
        <form id="createForm" class="row" style="margin-top:12px"><input id="adminName" placeholder="Your name (administrator)" maxlength="80" required style="flex:1;min-width:200px"><button class="primary">Create</button></form>
      </div>
      <div class="card"><h2>Restore an existing installation</h2>
        ${restorable.length ? `<p class="muted">Installations saved in this Identity data folder:</p><ul class="list">${restorable.map(p => `<li><div style="flex:1"><b>${esc(p.name)}</b><div class="mono faint">${esc(p.installation_id)}</div></div><button class="small" data-restore="${esc(p.name)}">Restore</button></li>`).join("")}</ul>`
          : `<p class="muted">No other installations in this data folder.</p>`}
        <p class="faint" style="font-size:13px">Restoring from a backup file or another computer isn't built yet.</p>
      </div>
    </div>
  </div>`;
  $("#createForm").onsubmit = async e => { e.preventDefault();
    try { await api("/api/install", {admin_name:$("#adminName").value}); step = 2; toast("Installation created and saved"); await load(); } catch(err){ toast(err.message, true); } };
  m.querySelectorAll("[data-restore]").forEach(b => b.onclick = () => switchProfile(b.dataset.restore));
}

// ---------- wizard ----------
const STEPS = [[1,"Welcome"],[2,"Your installation"],[3,"Identities"],[4,"Thought Controller"],[5,"GitHub"],[6,"Open your workspace"]];
function renderWizard(m){
  const inst = S.installation;
  m.innerHTML = `<div class="wizard">
    <ol class="steps">${STEPS.map(([n,l]) => `<li class="${n<step?"done":""} ${n===step?"on":""} ${n===1?"locked":""}" data-step="${n}"><span class="n">${n<step?"✓":n}</span>${l}</li>`).join("")}</ol>
    <div id="stepBody"></div></div>`;
  m.querySelectorAll("[data-step]").forEach(li => li.onclick = () => { const n = +li.dataset.step; if (n > 1) goStep(n); });
  const b = $("#stepBody");
  if (step === 2){
    b.innerHTML = `<div class="card"><h1>Your installation is saved</h1>
      <p class="muted">These IDs are permanent. They come back every time you open this profile, and are never reused anywhere else.</p>
      ${idCards()}
      <div class="navrow"><span></span><button class="primary" id="next">Next: identities</button></div></div>`;
  } else if (step === 3){
    b.innerHTML = `<div class="card"><h1>Identities</h1>
      <p class="muted">Identities are the companions, businesses and projects your Thought Controller will hold thoughts for. Start with TASS and an example business — you can add more any time.</p>
      ${identitiesBlock()}
      <div class="navrow"><button id="back">Back</button><button class="primary" id="next">Next: Thought Controller</button></div></div>`;
    wireIdentities();
  } else if (step === 4){
    b.innerHTML = `<div class="card"><h1>Thought Controller</h1>
      <p class="muted">Thought Controller is your main workspace. Identity checks whether it is running, verifies it belongs to this installation, and — only with your permission — asks it to start.</p>
      <div id="ctl"></div>
      <div class="navrow"><button id="back">Back</button><button class="primary" id="next">Next: GitHub</button></div></div>`;
    renderController($("#ctl"));
  } else if (step === 5){
    b.innerHTML = `<div class="card"><h1>GitHub</h1>
      <p class="muted">GitHub will later hold a private repository per identity. Nothing here needs it yet.</p>
      <div id="gh"></div>
      <div class="navrow"><button id="back">Back</button><button class="primary" id="next">Next: open your workspace</button></div></div>`;
    renderGitHub($("#gh"));
  } else {
    const lc = S.controller.last_check, ok = lc && lc.can_open;
    b.innerHTML = `<div class="card"><h1>Open your workspace</h1>
      <div class="kv" style="margin:14px 0">
        <div>Administrator</div><div class="mono">${esc(inst.admin_id)}</div>
        <div>Installation</div><div class="mono">${esc(inst.installation_id)}</div>
        <div>Controller service</div><div class="mono">${esc(inst.controller_service_id)}</div>
        <div>Identities</div><div>${(S.managed||[]).length}</div>
        <div>Thought Controller</div><div>${lc ? esc(lc.label) : "not checked yet"}</div>
        <div>Automatic startup</div><div>${S.controller.consent_valid ? "approved for the pinned build" : esc(S.controller.consent.status)}</div>
        <div>GitHub</div><div>${esc(S.github.state)}${S.github.mock?" (MOCK)":""}</div>
      </div>
      ${ok ? `<a href="${esc(lc.open_url)}" target="_blank" rel="noopener"><button class="primary">Open simulated Thought Controller dashboard ↗</button></a>`
           : `<div class="status warn"><div class="big">Thought Controller isn't verified yet</div>Go back to step 4 to check it. You can still finish setup — Identity works on its own.</div>`}
      <div class="navrow"><button id="back">Back</button><button class="primary" id="finish">Finish setup</button></div></div>`;
    $("#finish").onclick = async () => { try { await api("/api/setup", {step:6, complete:true}); step = 0; toast("Setup complete"); await load(); } catch(e){ toast(e.message, true); } };
  }
  const nx = $("#next"), bk = $("#back");
  if (nx) nx.onclick = () => goStep(step + 1);
  if (bk) bk.onclick = () => goStep(step - 1);
}
async function goStep(n){
  if (n < 2) n = 2;
  step = n;
  try { await api("/api/setup", {step:n}); } catch(e){ toast(e.message, true); }
  if (n >= 4 && autoChecked !== S.profile){ autoChecked = S.profile; check("page opened", true); }
  render();
}

function idCards(){
  const i = S.installation;
  const card = (role, val, note) => `<div class="idcard"><div class="role">${role}</div><div class="val">${esc(val)}</div><div class="row"><button class="small" onclick="copyText('${esc(val)}')">Copy</button><span class="faint" style="font-size:12.5px">${note}</span></div></div>`;
  return `<div class="grid2" style="margin-top:14px">
    ${card("Administrator", i.admin_id, "You. Sets permissions and consents.")}
    ${card("Installation", i.installation_id, "This setup on this computer.")}
    ${card("Thought Controller service", i.controller_service_id, "A system identity — not you, not TASS.")}
    <div class="idcard"><div class="role">Created</div><div style="margin:6px 0">${when(i.created_at)}</div><div class="faint" style="font-size:12.5px">Profile <b>${esc(S.profile)}</b> · reference code: ${esc(i.reference_repo)}</div></div>
  </div>`;
}

// ---------- identities ----------
function identitiesBlock(){
  const list = S.managed || [], has = n => list.some(x => x.display_name === n);
  return `${(!has("TASS") || !has("Example Workshop")) ? `<div class="question" style="margin:14px 0"><div class="q">Start with TASS and Example Workshop?</div>
      <p class="muted">Creates <b>TASS</b> (AI companion) and <b>Example Workshop</b> (Business), each with its own permanent ID. A business doesn't need a personality and won't get thoughts by itself.</p>
      <button class="primary" id="starter">Create TASS and Example Workshop</button></div>` : ""}
    ${list.length ? `<ul class="list">${list.map(x => `<li><span class="avatar ${esc(x.entity_type)}">${esc(x.display_name.charAt(0).toUpperCase())}</span><div style="flex:1"><b>${esc(x.display_name)}</b> <span class="faint">${esc(x.type_label)}</span><div class="mono faint">${esc(x.id)}</div></div><button class="small" onclick="copyText('${esc(x.id)}')">Copy ID</button></li>`).join("")}</ul>`
      : `<p class="faint">No identities yet.</p>`}
    <h3>Add another identity</h3>
    <form id="idForm" class="row"><input id="idName" placeholder="Name" maxlength="80" required style="flex:1;min-width:160px">
      <select id="idType">${S.types.filter(t => !["administrator","system_service"].includes(t.Key)).map(t => `<option value="${t.Key}">${esc(t.Label)}</option>`).join("")}</select>
      <button>Create</button></form>`;
}
function wireIdentities(){
  const st = $("#starter");
  if (st) st.onclick = async () => { try { const r = await api("/api/identities/starter", {}); toast(`${r.created.length} identit${r.created.length===1?"y":"ies"} created and saved`); await load(); } catch(e){ toast(e.message, true); } };
  $("#idForm").onsubmit = async e => { e.preventDefault();
    try { await api("/api/identities", {display_name:$("#idName").value, entity_type:$("#idType").value, request_id:rid()}); toast("Identity saved"); await load(); }
    catch(err){
      if (/already exists/.test(err.message) && confirm(err.message + "\n\nCreate another one with the same name anyway?")){
        try { await api("/api/identities", {display_name:$("#idName").value, entity_type:$("#idType").value, request_id:rid(), allow_duplicate_name:true}); await load(); } catch(e2){ toast(e2.message, true); }
      } else toast(err.message, true);
    } };
}

// ---------- controller ----------
const stateClass = s => ({VERIFIED:"ok", NOT_RUNNING:"warn", NOT_FOUND:"warn", NOT_CONFIGURED:"n", INCOMPATIBLE:"bad", WRONG_INSTANCE:"bad", VERSION_MISMATCH:"bad"}[s] || "n");
function renderController(el){
  const c = S.controller, lc = c.last_check, t = c.target || c.suggested_target, cons = c.consent;
  const h = lc && lc.health && lc.health.app === "thought-controller" ? lc.health : null;
  el.innerHTML = `
    <div class="status ${lc ? stateClass(lc.state) : "n"}" style="margin-top:14px">
      <div class="row"><div class="big">${lc ? esc(lc.label) : (checking ? "Checking Thought Controller…" : "Not checked yet")}</div><div class="spacer"></div>
        <button class="small" id="chk" ${checking?"disabled":""}>${checking ? "Checking…" : "Check again"}</button></div>
      ${lc ? `<p>${esc(lc.detail)}</p><p class="faint" style="font-size:12.5px">Checked ${when(lc.checked_at)} · ${lc.elapsed_ms} ms · ${esc(lc.trigger)} · a readiness check never sends an AI request</p>` : ""}
      ${lc && lc.consent_note ? `<p style="font-size:14px"><b>Startup:</b> ${esc(lc.consent_note)}</p>` : ""}
      ${lc && lc.attempt ? `<p style="font-size:14px"><span class="badge b-sim">SIMULATED LAUNCH</span> request <span class="mono">${esc(lc.attempt.request_id)}</span>: <b>${esc(lc.attempt.result)}</b> — ${esc(lc.attempt.reason)}</p>` : ""}
      ${lc && lc.can_open ? `<div class="row" style="margin-top:8px"><a href="${esc(lc.open_url)}" target="_blank" rel="noopener"><button class="primary">Open simulated Thought Controller dashboard ↗</button></a><button class="small danger" id="stopCtl">Stop controller (simulated)</button></div>` : ""}
    </div>
    ${h ? `<h3>What answered</h3><div class="kv">
      <div>Build</div><div class="mono">${esc(h.build.branch)} @ ${esc(h.build.commit)}</div>
      <div>Provenance</div><div>${esc(h.build.provenance)}</div>
      <div>Protocol</div><div class="mono">${esc(h.protocol)} · <span class="badge b-sim">SIMULATED</span> · auth: none</div>
      <div>Service</div><div>${esc(h.service.state)}${h.service.service_id ? ` · <span class="mono">${esc(h.service.service_id)}</span>`:""}</div>
      <div>Bound installation</div><div class="mono">${esc(h.service.installation_id || "none")}</div>
      <div>AI worker</div><div>${esc(h.worker.state)} — ${esc(h.worker.reason)}</div></div>` : ""}

    <h3>Where to look</h3>
    <div class="row"><input id="addr" class="mono" value="${esc(c.address)}" style="width:220px"><button class="small" id="saveAddr">Save address</button><button class="small" id="scan">Find on this computer</button>
      <span class="faint" style="font-size:12.5px">In Project Controller, use the port shown on Thought Controller's pane.</span></div>
    ${scanHits ? (scanHits.length ? `<table style="margin-top:8px"><tr><th>Address</th><th>Build</th><th>Service</th><th></th></tr>${scanHits.map(x => `<tr><td class="mono">${esc(x.address)}</td><td class="mono">${esc(x.branch)} @ ${esc(x.commit.slice(0,12))}</td><td>${esc(x.service_state)}${x.bound_installation_id ? (x.bound_installation_id===S.installation.installation_id?" · this installation":" · another installation"):""}</td><td><button class="small" data-use="${esc(x.address)}">Use</button></td></tr>`).join("")}</table>`
      : `<p class="faint">No Thought Controller host found on ports 7778–7899.</p>`) : ""}

    <h3>Approved controller build</h3>
    ${t ? `<div class="kv"><div>Repository</div><div>${esc(t.repo)} <span class="faint">(private)</span></div><div>Branch</div><div class="mono">${esc(t.branch)}</div><div>Commit</div><div class="mono">${esc(t.commit)}</div>
      <div>Kind</div><div><span class="badge b-warn">TEST / PINNED</span> ${esc(t.label)}</div>
      <div>Chosen</div><div>${c.target ? esc(c.target.chosen_by) + " · " + when(c.target.chosen_at) : "<i>suggested by this prototype — not pinned until you approve</i>"}</div></div>`
      : `<p class="muted">No build is pinned and this prototype has no suggestion. Pin one with “Change target”.</p>`}
    <div class="row" style="margin-top:8px"><button class="small" id="chgTarget">Change target…</button><button class="small" id="pinRunning">Pin the build answering at this address</button></div>

    <h3>Automatic startup</h3>
    ${c.consent_valid ? `<div class="status ok"><div class="big">Approved for this exact build</div>
        <p>Identity may ask the launcher to start <span class="mono">${esc(c.target.commit.slice(0,12))}</span> whenever it isn't running — without asking you again.</p>
        <p class="faint" style="font-size:12.5px">Consent <span class="mono">${esc(cons.consent_id)}</span> · ${when(cons.decided_at)} · ${esc(cons.scope)}</p>
        <button class="small danger" id="revoke">Revoke</button></div>`
    : `<div class="question">
        ${c.needs_reapproval ? `<p><span class="badge b-warn">BUILD CHANGED</span> You approved a different build before. The target changed, so Identity needs your approval again.</p>` : ""}
        ${cons.status === "denied" ? `<p><span class="badge b-n">DECLINED</span> You said no${cons.decided_at ? " on " + when(cons.decided_at) : ""}. Identity keeps working; nothing is started.</p>` : ""}
        ${cons.status === "revoked" ? `<p><span class="badge b-n">REVOKED</span> Nothing will be started until you approve again.</p>` : ""}
        <div class="q">Approve automatic startup for this specific controller on later launches?</div>
        <p class="muted" style="font-size:14px">Applies to <b>${t ? esc(t.repo) + " @ " + esc(t.commit.slice(0,12)) : "the build you pin"}</b> through Identity's <span class="badge b-sim">SIMULATED</span> launcher only. It does <b>not</b> approve AI model calls, GitHub access, code updates, messages or any other program. You can revoke it any time; a different build will ask again.</p>
        <p class="faint" style="font-size:13px">Simulated launcher: it sends one start request to a Thought Controller host that is already running on this computer. It never starts or installs a program.</p>
        <div class="row"><button class="primary" id="approve" ${t?"":"disabled"}>Approve and start</button><button id="deny">Not now</button></div>
      </div>`}

    <h3>Launch history <span class="badge b-sim">SIMULATED</span></h3>
    <p class="faint" style="font-size:13px">Checks ${c.counters.checks} · start requests ${c.counters.start_requests} · started ${c.counters.started} · reused ${c.counters.reused} · refused ${c.counters.refused} · errors ${c.counters.errors} · processes launched 0</p>
    ${c.attempts.length ? `<table><tr><th>When</th><th>Request</th><th>Trigger</th><th>Result</th><th>ms</th></tr>${c.attempts.slice().reverse().map(a => `<tr><td>${new Date(a.at).toLocaleTimeString()}</td><td class="mono">${esc(a.request_id.slice(0,18))}…</td><td>${esc(a.trigger)}</td><td><b>${esc(a.result)}</b><div class="faint">${esc(a.reason)}</div></td><td>${a.elapsed_ms}</td></tr>`).join("")}</table>` : `<p class="faint">No start requests yet.</p>`}`;
  $("#chk").onclick = () => check("owner pressed Check again", true);
  $("#saveAddr").onclick = async () => { try { await api("/api/controller/address", {address:$("#addr").value}); toast("Address saved"); await check("address changed", true); } catch(e){ toast(e.message, true); } };
  $("#scan").onclick = async () => { try { $("#scan").disabled = true; scanHits = (await api("/api/controller/scan", {})).hits; render(); } catch(e){ toast(e.message, true); } };
  el.querySelectorAll("[data-use]").forEach(b => b.onclick = async () => { try { await api("/api/controller/address", {address:b.dataset.use}); scanHits = null; await check("address chosen from search", true); } catch(e){ toast(e.message, true); } });
  $("#chgTarget").onclick = () => modal(`<h2>Change the approved target</h2><p class="muted">There is no published approved release. Enter the exact Thought Controller test build you choose to trust. Saved approval for another build stops applying.</p>
    <p><label>Branch<br><input id="tb" class="mono" style="width:100%" value="${esc(t ? t.branch : "")}"></label></p>
    <p><label>Full commit SHA (40 characters)<br><input id="tc" class="mono" style="width:100%" value="${esc(t ? t.commit : "")}"></label></p>
    <div class="row"><button class="primary" id="tsave">Pin this build</button><button onclick="closeModal()">Cancel</button></div>`) || (
    $("#tsave").onclick = async () => { try { await api("/api/controller/target", {branch:$("#tb").value, commit:$("#tc").value}); closeModal(); toast("Target pinned"); await check("target changed", false); } catch(e){ toast(e.message, true); } });
  $("#pinRunning").onclick = async () => {
    if (!confirm(`Pin whatever Thought Controller build answers at ${c.address} as the approved target?\n\nOnly do this if you chose to run that build.`)) return;
    try { const r = await api("/api/controller/target", {use_running:true}); toast("Pinned " + r.target.commit.slice(0,12)); await check("target changed", false); } catch(e){ toast(e.message, true); } };
  const ap = $("#approve"); if (ap) ap.onclick = async () => { try { const r = await api("/api/controller/consent", {decision:"approve"}); toast(r.check && r.check.attempt ? "Approved — one simulated start request sent" : "Approved"); await load(); } catch(e){ toast(e.message, true); } };
  const dn = $("#deny"); if (dn) dn.onclick = async () => { try { await api("/api/controller/consent", {decision:"deny"}); toast("Declined — nothing will be started"); await check("after declining", false); } catch(e){ toast(e.message, true); } };
  const rv = $("#revoke"); if (rv) rv.onclick = async () => { if (!confirm("Revoke automatic startup? Nothing will be started until you approve again.")) return; try { await api("/api/controller/consent", {decision:"revoke"}); toast("Revoked"); await load(); } catch(e){ toast(e.message, true); } };
  const sc = $("#stopCtl"); if (sc) sc.onclick = async () => { if (!confirm("Ask the host to stop this installation's controller service? (SIMULATED — no program is ended.)")) return; try { await api("/api/controller/stop", {}); toast("Stopped"); await check("after stop", false); } catch(e){ toast(e.message, true); } };
}
async function check(trigger, allowStart){
  if (checking) return; checking = true; if (S) render();
  try { await api("/api/controller/check", {trigger, allow_start: allowStart}); } catch(e){ toast(e.message, true); }
  checking = false; await load();
}

// ---------- GitHub ----------
function renderGitHub(el){
  const g = S.github, cls = g.mock ? "warn" : "n";
  const cli = S.github_cli;
  el.innerHTML = `
    <div class="status ${cls}" style="margin-top:14px"><div class="row"><div class="big">${esc(g.state)}</div>${g.mock ? `<span class="badge b-sim">MOCK — test display</span>` : `<span class="badge b-n">REAL STATUS</span>`}</div>
      <p>${esc(g.summary)}</p><p class="muted" style="font-size:14px">${esc(g.next)}</p></div>
    <div class="status bad" style="margin-top:12px"><div class="big">Source access: ${esc(g.source_access)}</div><p>${esc(g.source_detail)}</p></div>
    <div class="status n" style="margin-top:12px">
      <div class="row"><div class="big">Real GitHub check (optional)</div><span class="badge b-n">EXTERNAL CLI · NOT AN IDENTITY LOGIN</span></div>
      <p class="muted">Checks the account already authorized in GitHub's official command-line tool on this computer. Does not read or store a token, connect your Identity card, or create a repo.</p>
      <button id="ghCLI" type="button">Check GitHub CLI account (REAL)</button>
      ${cli ? `<p><strong>${esc(cli.state)}</strong> ${cli.account ? `· account: <strong>${esc(cli.account)}</strong>` : ""}</p><p>${esc(cli.detail)}</p><p class="muted">${esc(cli.next)}</p><p class="faint">Checked: ${when(cli.checked_at)} · ${esc(cli.elapsed_ms)} ms · Not linked to this Identity profile</p>` : `<p class="muted">Not checked yet. No request has been sent.</p>`}
    </div>
    <p class="faint" style="font-size:13px;margin-top:10px">Identity GitHub account linking: NOT IMPLEMENTED · Identity tokens stored: 0 · repositories created: 0</p>
    <details style="margin-top:10px"><summary>Test the GitHub card (MOCK states)</summary>
      <p class="muted" style="font-size:14px">Shows how other states would look. Nothing contacts GitHub.</p>
      <select id="ghSel">${[["","Real status (NOT CONNECTED)"],["mock_connected","MOCK CONNECTED"],["mock_offline","MOCK OFFLINE"],["mock_access_required","MOCK ACCESS REQUIRED"]].map(([v,l]) => `<option value="${v}" ${S.github_setting===v?"selected":""}>${l}</option>`).join("")}</select>
    </details>`;
  $("#ghSel").onchange = async e => { try { await api("/api/github/simulate", {state:e.target.value}); await load(); } catch(err){ toast(err.message, true); } };
  $("#ghCLI").onclick = async () => { try { $("#ghCLI").disabled = true; await api("/api/github/cli-check", {}); await load(); } catch(err) { toast(err.message, true); } };
}

// ---------- overview (after setup) ----------
function renderOverview(m){
  const i = S.installation;
  m.innerHTML = `
    <div class="row" style="margin-bottom:18px"><div><span class="badge b-ok">SET UP</span><h1 style="margin-top:6px">Your installation</h1>
      <p class="muted">Welcome back. Same administrator, installation and controller service as last time.</p></div></div>
    ${S.problems.length ? `<div class="status bad" style="margin-bottom:16px"><div class="big">Files that couldn't be loaded</div>${S.problems.map(p => `<div class="mono">${esc(p.file)} — ${esc(p.reason)}</div>`).join("")}<p class="faint">Left untouched.</p></div>` : ""}
    <div class="stack">
      <div class="card"><h2>IDs</h2>${idCards()}</div>
      <div class="card"><h2>Thought Controller</h2><div id="ctl"></div></div>
      <div class="grid2">
        <div class="card"><h2>Identities</h2>${identitiesBlock()}</div>
        <div class="card"><h2>GitHub</h2><div id="gh"></div></div>
      </div>
      <details><summary>Test tools</summary>
        <div class="stack" style="margin-top:12px">
          <div class="row"><button id="tNew" class="primary">Test as New User</button><span class="muted" style="font-size:14px">Opens a brand-new empty profile. This profile stays exactly as it is.</span></div>
          <div class="row"><button id="tWrong">Point the controller address at Identity itself</button><span class="muted" style="font-size:14px">Should show INCOMPATIBLE (not trusted just because something answered). Change the address back afterwards.</span></div>
          <div class="row"><button id="tFail">Make the next save fail</button><span class="muted" style="font-size:14px">The next identity create should fail with nothing written.</span></div>
          <div class="row"><button id="tWizard">Re-open the setup wizard</button><span class="muted" style="font-size:14px">Same IDs; just walks the screens again.</span></div>
        </div></details>
    </div>`;
  renderController($("#ctl")); renderGitHub($("#gh")); wireIdentities();
  $("#tNew").onclick = newUser;
  $("#tWrong").onclick = async () => { try { await api("/api/controller/address", {address:"127.0.0.1:" + S.config.port}); await check("test: address points at Identity", false); } catch(e){ toast(e.message, true); } };
  $("#tFail").onclick = async () => { try { await api("/api/test/fail-next-save", {}); toast("The next save will fail on purpose"); } catch(e){ toast(e.message, true); } };
  $("#tWizard").onclick = () => goStep(2);
}

// ---------- header ----------
async function newUser(){
  if (!confirm("Open a brand-new, empty test profile and walk the first-run setup as a new administrator?\n\nThe current profile is kept exactly as it is; you can switch back from Profiles.")) return;
  try { const r = await api("/api/profiles/new", {}); step = null; scanHits = null; autoChecked = ""; toast("New empty profile " + r.profile); await load(); } catch(e){ toast(e.message, true); }
}
async function switchProfile(name){
  try { await api("/api/profiles/switch", {profile:name}); step = null; scanHits = null; autoChecked = ""; $("#profileMenu").classList.remove("on"); toast("Switched to " + name); await load(); } catch(e){ toast(e.message, true); }
}
$("#btnNewUser").onclick = newUser;
$("#btnProfiles").onclick = () => {
  const mn = $("#profileMenu");
  mn.innerHTML = `<div class="faint" style="font-size:12px;padding:6px 10px">Test profiles in ${esc(S.config.data_dir)}</div>` + S.profiles.map(p => `<button data-p="${esc(p.name)}">${p.active?"● ":""}<b>${esc(p.name)}</b><div class="mono faint">${esc(p.installation_id || "no installation yet")}</div></button>`).join("") + `<button id="mnNew">＋ Test as New User</button>`;
  mn.classList.toggle("on");
  mn.querySelectorAll("[data-p]").forEach(b => b.onclick = () => switchProfile(b.dataset.p));
  $("#mnNew").onclick = () => { mn.classList.remove("on"); newUser(); };
};
document.addEventListener("click", e => { if (!e.target.closest("#profileMenu") && e.target.id !== "btnProfiles") $("#profileMenu").classList.remove("on"); });
$("#btnDiag").onclick = async () => { try { copyText(await api("/api/diagnostics")); } catch(e){ toast(e.message, true); } };
$("#btnLogs").onclick = () => {
  $("#drawerBody").innerHTML = (S.events_error ? `<div class="status bad">${esc(S.events_error)}</div>` : "") + S.events.map(e => `<div class="ev"><span class="faint">${new Date(e.at).toLocaleTimeString()}</span><span class="k">${esc(e.kind)}</span>${esc(e.detail)} ${e.id?`<span class="mono faint">${esc(e.id)}</span>`:""}</div>`).join("");
  $("#drawer").classList.add("on"); };
$("#closeDrawer").onclick = () => $("#drawer").classList.remove("on");
document.addEventListener("keydown", e => { if (e.key === "Escape"){ closeModal(); $("#drawer").classList.remove("on"); } });

load();
setInterval(() => {
  const typing = document.activeElement && ["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName);
  if (!document.hidden && !typing && !checking && !$("#modalbg").classList.contains("on")) load(true);
}, 3000);
</script>
</body>
</html>
